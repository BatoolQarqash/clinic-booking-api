name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The .NET 8 SDK cannot read .slnx solutions, so build the test project,
    # which also builds the API through its project reference.
    env:
      TEST_PROJECT: tests/ClinicBooking.Tests/ClinicBooking.Tests.csproj

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore $TEST_PROJECT

      - name: Build
        run: dotnet build $TEST_PROJECT --no-restore

      - name: Test
        run: dotnet test $TEST_PROJECT --no-build --verbosity normal
